[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voicetype"
version = "0.3.0"
description = "Local Korean dictation with selectable speaker muting and echo reduction"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy==2.5.4",
    "webrtcvad-wheels==2.0.14.post1",
]

[project.scripts]
voicetype = "voicetype:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicetype_resources"]

[tool.hatch.build.targets.wheel.force-include]
"src/voicetype.py" = "voicetype.py"
"src/audio_modes.py" = "audio_modes.py"
"src/build_audio_capture.py" = "build_audio_capture.py"
"src/voicetype_paths.py" = "voicetype_paths.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "LICENSE", "THIRD_PARTY.md", "RELEASE_PLAN.md", "README.md", "CHANGELOG.md", "pyproject.toml", "uv.lock", "install.py", "Install.command", "Uninstall.command"]

[dependency-groups]
dev = [
    "lupa>=2.8",
]
